<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스불재 찍먹 작가 소개</title>
<style>
  :root {
    --bg: #fff3f6;
    --card: #ffffff;
    --pink: #ff9eb8;
    --pink-soft: #ffe0e9;
    --mint: #c9f0e3;
    --yellow: #fff2b8;
    --text: #5b4350;
    --sub: #9a7f8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 15% 20%, var(--pink-soft) 0 60px, transparent 61px),
      radial-gradient(circle at 85% 80%, var(--mint) 0 80px, transparent 81px),
      radial-gradient(circle at 80% 15%, var(--yellow) 0 40px, transparent 41px),
      var(--bg);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--text);
    line-height: 1.7;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 3px solid var(--pink);
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 8px 0 var(--pink-soft), 0 14px 30px rgba(255, 158, 184, .25);
    position: relative;
  }
  .face {
    font-size: 2rem;
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }
  .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 2px 14px;
    background: var(--yellow);
    border-radius: 999px;
    font-size: .85rem;
    color: var(--sub);
  }
  h1 {
    margin-top: 8px;
    font-size: 1.7rem;
    color: var(--pink);
    text-shadow: 2px 2px 0 var(--pink-soft);
    letter-spacing: -.02em;
  }
  h1 small { display: block; font-size: .95rem; color: var(--sub); text-shadow: none; font-weight: normal; }
  .bubble {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 20px;
    background: var(--pink-soft);
    text-align: left;
    font-size: .98rem;
  }
  .bubble.mint { background: var(--mint); }
  .bubble.yellow { background: var(--yellow); }
  .bubble b { color: #e0668a; }
  .kaomoji { display: block; margin-top: 4px; font-size: 1.1rem; text-align: center; }
  .footer { margin-top: 22px; font-size: .85rem; color: var(--sub); }
  .heart { display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  @media (prefers-reduced-motion: reduce) { .face, .heart { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="face">(っ◞‸◟c)</div><br>
    <span class="badge">✨ 작가 소개 ✨</span>
    <h1>스불재 찍먹<small>안녕하세요, 처음 뵙겠습니다 (๑•́ ₃ •̀๑)</small></h1>

    <p class="bubble">
      안녕하세요! 스불재 찍먹이라고 합니다 <span class="kaomoji">(๑˃ᴗ˂)ﻭ</span>
      와주셔서 정말 정말 감사드려요!
    </p>

    <p class="bubble mint">
      이 작품은 <b>아무도 안 만들어 주셔서</b> 제가 직접 만들어서 <b>제가 맛있게 먹으려고</b> 만든 작품이에요 <span class="kaomoji">( ´ ▽ ` )ﾉ 냠냠</span>
      혹시 취향이 맞으신다면 같이 즐겨 주세요!
    </p>

    <p class="bubble yellow">
      이용하시다가 <b>불편한 점</b>이 있으시면<br>
      언제든지 <b>댓글로 알려 주세요</b>! 열심히 고쳐 볼게요 <span class="kaomoji">(っ◞‸◟c) 잘 부탁드립니다…!</span>
    </p>

    <p class="footer">읽어 주셔서 감사합니다 <span class="heart">💗</span> <br>(⸝⸝•‧̫•⸝⸝)</p>
  </main>
</body>
</html>
